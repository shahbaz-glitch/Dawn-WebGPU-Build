name: Build Dawn - Windows D3D12

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-dawn:
    runs-on: windows-2025-vs2026
    timeout-minutes: 120

    steps:
      - name: Show runner and toolchain
        shell: pwsh
        run: |
          Write-Host "=== Windows ==="
          Get-ComputerInfo |
            Select-Object WindowsProductName, WindowsVersion, OsArchitecture

          Write-Host "=== Tools ==="
          git --version
          cmake --version
          python --version

          Write-Host "=== Visual Studio ==="

          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"

          if (-not (Test-Path $vswhere)) {
            throw "vswhere.exe was not found."
          }

          $vsPath = & $vswhere `
            -latest `
            -products * `
            -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 `
            -property installationPath

          if (-not $vsPath) {
            throw "Visual Studio with MSVC x64 tools was not found."
          }

          Write-Host "Visual Studio path:"
          Write-Host $vsPath

          if (-not ($vsPath -match "\\Microsoft Visual Studio\\18\\")) {
            throw "Expected Visual Studio 2026 (version 18) but found: $vsPath"
          }

          Write-Host "Visual Studio 2026 detected."

          Write-Host "=== Disk ==="
          Get-PSDrive -Name C |
            Select-Object Name, Used, Free

      - name: Clone Dawn
        shell: pwsh
        run: |
          git clone --depth 1 https://dawn.googlesource.com/dawn.git dawn

          Write-Host "=== Dawn revision ==="
          git -C dawn rev-parse HEAD

      - name: Configure Dawn - Visual Studio 2026 x64
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"

          $vsPath = & $vswhere `
            -latest `
            -products * `
            -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 `
            -property installationPath

          if (-not $vsPath) {
            throw "Visual Studio with MSVC x64 tools was not found."
          }

          Write-Host "Using Visual Studio instance:"
          Write-Host $vsPath

          cmake `
            -S dawn `
            -B build-dawn `
            -G "Visual Studio 18 2026" `
            -A x64 `
            -DCMAKE_GENERATOR_INSTANCE="$vsPath" `
            -DCMAKE_CONFIGURATION_TYPES=Release `
            -DDAWN_FETCH_DEPENDENCIES=ON `
            -DDAWN_ENABLE_INSTALL=ON `
            -DCMAKE_INSTALL_PREFIX="$PWD\DawnSDK" `
            -DDAWN_ENABLE_D3D12=ON `
            -DDAWN_ENABLE_D3D11=OFF `
            -DDAWN_ENABLE_VULKAN=OFF `
            -DDAWN_ENABLE_METAL=OFF `
            -DDAWN_ENABLE_DESKTOP_GL=OFF `
            -DDAWN_ENABLE_OPENGLES=OFF `
            -DDAWN_ENABLE_NULL=ON `
            -DDAWN_ENABLE_WEBGPU_ON_WEBGPU=OFF `
            -DDAWN_ENABLE_SPIRV_VALIDATION=OFF `
            -DDAWN_USE_WINDOWS_UI=ON `
            -DDAWN_USE_WAYLAND=OFF `
            -DDAWN_USE_X11=OFF `
            -DDAWN_USE_GLFW=OFF `
            -DDAWN_USE_BUILT_DXC=OFF `
            -DDAWN_DXC_ENABLE_ASSERTS_IN_NDEBUG=OFF `
            -DDAWN_USE_AGILITY_SDK=OFF `
            -DDAWN_ENABLE_SWIFTSHADER=OFF `
            -DDAWN_BUILD_SAMPLES=OFF `
            -DDAWN_BUILD_TESTS=OFF `
            -DDAWN_BUILD_NODE_BINDINGS=OFF `
            -DDAWN_BUILD_BENCHMARKS=OFF `
            -DDAWN_BUILD_FUZZERS=OFF `
            -DDAWN_BUILD_PROTOBUF=OFF `
            -DDAWN_ENABLE_ASAN=OFF `
            -DDAWN_ENABLE_TSAN=OFF `
            -DDAWN_ENABLE_MSAN=OFF `
            -DDAWN_ENABLE_UBSAN=OFF `
            -DDAWN_ENABLE_RTTI=OFF `
            -DDAWN_ALWAYS_ASSERT=OFF `
            -DDAWN_ENABLE_ERROR_INJECTION=OFF `
            -DDAWN_WERROR=OFF `
            -DDAWN_WEVERYTHING=OFF `
            -DDAWN_EMIT_COVERAGE=OFF `
            -DDAWN_FORCE_SYSTEM_COMPONENT_LOAD=OFF `
            -DDAWN_BUILD_MONOLITHIC_LIBRARY=STATIC `
            -DBUILD_SHARED_LIBS=OFF `
            -DDAWN_ENABLE_PIC=ON `
            -DTINT_ENABLE_INSTALL=OFF `
            -DTINT_BUILD_CMD_TOOLS=OFF `
            -DTINT_BUILD_SPV_READER=OFF `
            -DTINT_BUILD_WGSL_READER=ON `
            -DTINT_BUILD_GLSL_WRITER=OFF `
            -DTINT_BUILD_GLSL_VALIDATOR=OFF `
            -DTINT_BUILD_HLSL_WRITER=ON `
            -DTINT_BUILD_MSL_WRITER=OFF `
            -DTINT_BUILD_SPV_WRITER=OFF `
            -DTINT_BUILD_WGSL_WRITER=ON `
            -DTINT_BUILD_NULL_WRITER=ON `
            -DTINT_BUILD_IR_BINARY=OFF `
            -DTINT_BUILD_FUZZERS=OFF `
            -DTINT_BUILD_FUZZER_VULKAN_SUPPORT=OFF `
            -DTINT_BUILD_BENCHMARKS=OFF `
            -DTINT_BUILD_TESTS=OFF `
            -DTINT_BUILD_MESA=OFF

      - name: Verify CMake generator and compiler
        shell: pwsh
        run: |
          Write-Host "=== CMake generator ==="

          $cache = Get-Content "build-dawn/CMakeCache.txt" -Raw

          $generatorLine = $cache |
            Select-String "CMAKE_GENERATOR:INTERNAL"

          if ($generatorLine) {
            Write-Host $generatorLine
          }

          $instanceLine = $cache |
            Select-String "CMAKE_GENERATOR_INSTANCE"

          if ($instanceLine) {
            Write-Host $instanceLine
          }

          if ($cache -notmatch "Visual Studio 18 2026") {
            throw "CMake did not select Visual Studio 18 2026."
          }

          Write-Host "Visual Studio 18 2026 generator confirmed."

          Write-Host "=== Actual C++ compiler metadata ==="

          $compilerFile = Get-ChildItem `
            "build-dawn/CMakeFiles" `
            -Recurse `
            -Filter "CMakeCXXCompiler.cmake" |
            Select-Object -First 1

          if (-not $compilerFile) {
            throw "CMakeCXXCompiler.cmake was not found."
          }

          Write-Host "Compiler metadata:"
          Write-Host $compilerFile.FullName

          $compilerInfo = Get-Content $compilerFile.FullName -Raw

          $compilerInfo |
            Select-String 'CMAKE_CXX_COMPILER_ID|CMAKE_CXX_COMPILER_VERSION|CMAKE_CXX_COMPILER'

          if ($compilerInfo -notmatch 'set\(CMAKE_CXX_COMPILER_ID "MSVC"\)') {
            throw "CMake did not select the MSVC compiler."
          }

          Write-Host "MSVC compiler confirmed."

      - name: Build Dawn
        shell: pwsh
        run: |
          cmake `
            --build build-dawn `
            --config Release `
            --parallel 4

      - name: Install Dawn SDK
        shell: pwsh
        run: |
          cmake `
            --install build-dawn `
            --config Release `
            --prefix DawnSDK

      - name: Verify Dawn SDK
        shell: pwsh
        run: |
          if (-not (Test-Path "DawnSDK/include/webgpu/webgpu.h")) {
            throw "Missing DawnSDK/include/webgpu/webgpu.h"
          }

          if (-not (Test-Path "DawnSDK/lib")) {
            throw "Missing DawnSDK/lib"
          }

          Write-Host "=== WebGPU header ==="
          Get-Item "DawnSDK/include/webgpu/webgpu.h" |
            Select-Object FullName, Length

          Write-Host "=== Dawn libraries ==="
          Get-ChildItem "DawnSDK/lib" -File |
            Select-Object Name, Length

          Write-Host "=== Final disk state ==="
          Get-PSDrive -Name C |
            Select-Object Name, Used, Free

      - name: Record build manifest
        shell: pwsh
        run: |
          @"
          Dawn source:
          $(git -C dawn rev-parse HEAD)

          Platform:
          Windows Server 2025

          Toolchain:
          Visual Studio 2026
          MSVC
          x64
          Release

          Build:
          CMake
          Visual Studio generator
          Static monolithic library

          Backend:
          D3D12=ON
          D3D11=OFF
          Vulkan=OFF
          Metal=OFF
          DesktopGL=OFF
          OpenGLES=OFF
          Null=ON

          Windowing:
          WindowsUI=ON
          GLFW=OFF
          Wayland=OFF
          X11=OFF

          Dependencies:
          DAWN_FETCH_DEPENDENCIES=ON

          Tint:
          WGSL reader=ON
          HLSL writer=ON
          WGSL writer=ON
          NULL writer=ON
          SPIR-V reader=OFF
          SPIR-V writer=OFF
          GLSL writer=OFF
          GLSL validator=OFF
          MSL writer=OFF
          IR binary=OFF

          Extras:
          Samples=OFF
          Tests=OFF
          Node bindings=OFF
          Benchmarks=OFF
          Fuzzers=OFF
          Protobuf=OFF
          SwiftShader=OFF
          Built DXC=OFF
          Agility SDK=OFF
          Error injection=OFF
          "@ | Set-Content DawnSDK/build-manifest.txt -Encoding utf8

      - name: Upload Dawn SDK
        uses: actions/upload-artifact@v4
        with:
          name: dawn-windows-d3d12-sdk
          path: DawnSDK
          if-no-files-found: error
          compression-level: 6
